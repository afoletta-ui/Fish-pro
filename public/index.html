<style>

html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:'Press Start 2P',ui-monospace,Menlo,monospace;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:8px;user-select:none;-webkit-user-select:none}

<script>
const XB=150,W=320,H=180,HZ=84,F=W/2/Math.tan(.7),CH=1.5,TAU=Math.PI*2,SA=.9,TS=200;
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),hud=document.getElementById('hud');
cv.width=W;cv.height=H;
const img=ctx.createImageData(W,H),buf=new Uint32Array(img.data.buffer);
const P=h=>{const n=parseInt(h.slice(1),16);return 0xff000000|(n&255)<<16|(n>>8&255)<<8|n>>16};
const O=['#12408a','#1b63b0','#2f8ccc','#a9e4f2'].map(P),FOG=P('#8cc8e6');
const SKY=['#ffd9a0','#ffbd80','#f9a08c','#e8809c','#c2689f','#8f58a0','#60499a','#41387e','#2b2a62'];
const B=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5];
const skyPre=new Uint32Array(W*HZ);{const SC=SKY.map(P);for(let y=0;y<HZ;y++){const v=Math.max(0,Math.min(7.999,(HZ-y-5)/10)),i=Math.floor(v),f=v-i;for(let x=0;x<W;x++)skyPre[y*W+x]=B[(x&3)+(y&3)*4]/16<f?SC[i+1]:SC[i]}}
const drawSky=()=>{buf.set(skyPre);ctx.putImageData(img,0,0,0,0,W,HZ)};
const GLT=[P('#ffe9b0'),P('#ffc27a')];let HAZE=P('#6a8ccc');
const ca=[],XS=[];for(let x=0;x<W;x++){XS[x]=(x-W/2+.5)/F;ca[x]=Math.atan(XS[x])}
const far=a=>6+18*(1-Math.abs(Math.sin(2*a+1)))+10*(1-Math.abs(Math.sin(5*a+2)))+3*Math.sin(13*a);
const near=a=>4+12*(1-Math.abs(Math.sin(3*a+.5)))+8*(1-Math.abs(Math.sin(7*a+1.3)))+2*Math.sin(19*a);
const wrapA=d=>((d+Math.PI)%TAU+TAU)%TAU-Math.PI;
const rel=v=>((v%TS)+TS*1.5)%TS-TS/2;
const R=(x,y,w,h)=>ctx.fillRect(Math.round(x),Math.round(y),Math.max(1,Math.round(w)),Math.max(1,Math.round(h)));
const GF={A:'25755',B:'65656',C:'34443',D:'65556',E:'74647',F:'74644',G:'34553',H:'55755',I:'72227',J:'11152',K:'55655',L:'44447',M:'57755',N:'65555',O:'25552',P:'65644',Q:'25573',R:'65655',S:'34216',T:'72222',U:'55557',V:'55552',W:'55775',X:'55255',Y:'55222',Z:'71247',
'0':'75557','1':'26227','2':'61247','3':'61216','4':'55711','5':'74616','6':'34757','7':'71122','8':'75757','9':'75716',
'.':'00002',',':'00024','!':'22202','?':'61202','-':'00700','+':'02720','/':'11244',':':'02020',"'":'22000','’':'22000','$':'36236','%':'51245','#':'57575','(':'12221',')':'42224','°':'25200','_':'00007','=':'07070','*':'05250','"':'55000','&':'25253','<':'12421','>':'42124'};
function ptx0(s,x,y,c,k){ctx.fillStyle=c;for(let i=0;i<s.length;i++){const g=GF[s[i]];if(!g)continue;for(let r=0;r<5;r++){const v=g.charCodeAt(r)-48;if(v)for(let q=0;q<3;q++)if(v&(4>>q))ctx.fillRect(x+(i*4+q)*k,y+r*k,k,k)}}}
function ptxt(s,x,y,c,k,sh){k=Math.max(1,Math.round(k||1));s=String(s).toUpperCase();x=Math.round(x);y=Math.round(y);if(sh!==0)ptx0(s,x+k,y+k,'#000',k);ptx0(s,x,y,c,k)}
const tw=(s,k)=>String(s).length*4*(k||1)-(k||1);
let sd=7;const rnd=()=>(sd=(sd*16807)%2147483647)/2147483647;
const bu=[];for(let i=0;i<0;i++)bu.push({x:rnd()*TS,z:rnd()*TS});

let t=0,px=0,pz=6,hd=0,sp=0,roll=0,bump=0,wk=0,last=0,wake=[],sch=[],nextS=20,mode=0,mph=0,tgt=null,lure=null,rt=0,rl=null;
const A={},M={ArrowLeft:'L',a:'L',ArrowRight:'R',d:'R',ArrowUp:'U',w:'U',ArrowDown:'D',s:'D'};
const start=()=>document.getElementById('start').style.display='none';
const key=e=>M[e.key.length>1?e.key:e.key.toLowerCase()];
addEventListener('keydown',e=>{start();const a=key(e);if(a){A[a]=1;e.preventDefault()}});
addEventListener('keyup',e=>{const a=key(e);if(a)A[a]=0});
addEventListener('blur',()=>{for(const k in A)A[k]=0});
document.getElementById('wrap').addEventListener('pointerdown',start);
document.querySelectorAll('#pad button').forEach(b=>{
  const a=b.dataset.a,on=e=>{e.preventDefault();start();A[a]=1},off=()=>{A[a]=0};
  b.addEventListener('pointerdown',on);
  ['pointerup','pointerleave','pointercancel'].forEach(n=>b.addEventListener(n,off));
});

function update(dt){
  const tn=(A.R?1:0)-(A.L?1:0),V=vmx();
  if(!foot&&vT>=0&&!dead){
    const dry=hasFu()&&fuel<=0,th=dry?0:(A.U?1:A.D?-1:0);
    sp+=th*V*.4375*dt;sp-=sp*.35*dt;sp=mode>3?0:Math.max(-V,Math.min(V,sp));
    if(th&&hasFu()&&mode==0){fuel=Math.max(0,fuel-VES[vT].b*dt);if(!fuel)toast('OUT OF FUEL!')}
    hd+=tn*1.2*Math.min(1,Math.abs(sp)/2.5)*(sp<0?-1:1)*dt;
    roll+=(tn*Math.min(1,sp/8)-roll)*6*dt;
    px+=Math.sin(hd)*sp*dt;pz+=Math.cos(hd)*sp*dt;
    {const lim=zones*100;if(pz>lim-2){pz=lim-2;sp*=.3}if(pz<Math.max(3,tE+3)){pz=Math.max(3,tE+3);sp*=.3}if(px>XB-2){px=XB-2;sp*=.3}if(px<2-XB){px=2-XB;sp*=.3}}
    if(mode==0)ramTick();
  }else{sp=0;roll=0}
  if(dead){dead.t+=dt;if(dead.t>2.6&&deadEl.style.display!='grid'){deadEl.querySelector('#deadt').textContent='YOUR '+dead.v+' EXPLODED'+(dead.by?String.fromCharCode(10)+'RAMMED BY '+dead.by:'')+String.fromCharCode(10)+'YOU LOST EVERYTHING';deadEl.style.display='grid'}}
  bump=Math.max(0,bump-dt);
  if(!bump)for(const b of bu){const dx=rel(b.x-px),dz=rel(b.z-pz);if(dx*dx+dz*dz<1.6){sp=-sp*.4;bump=.35;break}}
  wk+=dt;
  if(Math.abs(sp)>1&&wk>.04){wk=0;const s=Math.sin(hd),c=Math.cos(hd);
    for(const k of[-1,1])wake.push({x:px-s*1.6+c*k*.5,z:pz-c*1.6-s*k*.5,l:1});
    if(wake.length>120)wake.splice(0,wake.length-120)}
  for(const p of wake)p.l-=dt/1.3;
  wake=wake.filter(p=>p.l>0);
  for(const h of sch){h.age+=dt;h.x+=h.vx*dt;h.z+=h.vz*dt}
  sch=sch.filter(h=>h.age<h.life);
  if((Math.abs(sp)>Math.min(3,V*.6)||foot&&mode>0&&mode<6)&&(nextS-=dt)<=0){nextS=(45+Math.random()*45)*(1-.5*env.bw);if(!sch.length)mkSchool()}
  if(mode==2||mode==5)mph+=dt;
  if(mode==1){const m1=sch.length?'TAP A BUST FOR TUNA OR ANY SPOT':'TAP ANY SPOT TO CAST - FIND A BUST FOR TUNA';if(msg.textContent!=m1)msg.textContent=m1}
  if(mode==5)ah+=((A.R?1:0)-(A.L?1:0))*dt;
  if(mode==3&&(rt-=dt)<=0)startReel();
  envTick();walkTick(dt);netTick(dt);uiTick(dt);soundTick(dt);
  cash.textContent=mny(money)+String.fromCharCode(10)+(foot?'ON THE BEACH':'OUT '+Math.max(0,Math.round(pz))+' / '+zones*100+' M')+(cans?String.fromCharCode(10)+'JERRY CANS '+cans:'')+String.fromCharCode(10)+clockStr()+' '+tideStr()+(env.bw>.45?' BITE TIME!':'')+(ws?String.fromCharCode(10)+'ONLINE '+(Object.keys(others).length+1):'');
  {const nz=!foot&&zones<100&&(mode==0||mode==1||mode==2||mode==5)&&pz>zones*100-15;buyz.style.display=nz?'block':'none';
    if(nz){buyz.textContent='BORDER! UNLOCK '+zones*100+'-'+nxm()+' M  '+mny(ZP[zones]);buyz.disabled=money<ZP[zones]}}
  const r=mode==4&&rl;
  if(r){
    if(r.st==0){r.age+=dt;r.ca+=dt*9;r.d=Math.max(3,r.d0*(1-r.age/7));
      if(r.hook&&r.age>=r.bt){r.st=1;r.biteAt=performance.now();msg.textContent='';sfx('bite')}
      else if(!r.hook&&r.age>=7)fail('NOTHING BITING HERE - TRY A NEW SPOT')}
    else if(r.st==1){if(performance.now()-r.biteAt>r.win)fail('IT GOT AWAY - TOO SLOW!')}
    else if(r.st==2){
      if(r.sgOn){if((r.sgT-=dt)<=0){r.sgOn=0;r.sgN=2.5+Math.random()*2}}
      else if(r.pw>.2&&(r.sgN-=dt)<=0){r.sgOn=1;r.sgT=.8+2.2*r.pw}
      r.p-=r.dec*.75*(r.sgOn?1.8+.2*r.pw:1)*r.fury*ROD[rT].rd*dt;r.sh=(2+5*r.pw)*(r.sgOn?2:1);
      r.T=Math.max(0,r.T-(r.sgOn?.45:.8)*dt);if(r.sgOn&&(r.dg=(r.dg||0)-dt)<=0){r.dg=.07;sfx('drag')}
      r.d=Math.max(3,r.dB*(1-r.p*.9));
      const tx=r.sgOn?(r.T>.6?'EASE OFF! THE LINE IS ABOUT TO SNAP!':'IT IS RUNNING! WATCH THE LINE TENSION'):r.fury>1?'MONSTER FIGHTER! REEL HARD!':'REEL AS FAST AS YOU CAN!';
      if(msg.textContent!=tx)msg.textContent=tx;
      if(r.p<=0)fail('THE FISH SHOOK THE HOOK!')}
    else if(r.st==3&&(r.ft-=dt)<=0)endReel();
    else if(r.st==4&&!r.ok&&(r.ct-=dt)<=0){r.ok=1;cgo.style.visibility='visible'}
  }
}

function render3(){
  const s=Math.sin(hd),c=Math.cos(hd),cx=px-s*5,cz=pz-c*5;
  // sky
  drawSky();
  // sun
  const dA=wrapA(env.sAz-hd),sy=Math.round(HZ+10-env.sEl*86),lo=env.sEl<.3;
  if(Math.abs(dA)<1.3&&sy<HZ+16){const sx=W/2+F*Math.tan(dA);ctx.fillStyle=lo?'#fff2a8':'#fffbe8';for(const[rr,al]of[[24,.12],[19,.16]]){ctx.globalAlpha=al;for(let dy=-rr;dy<=rr;dy+=2){const h=Math.round(Math.sqrt(rr*rr-dy*dy)/2)*2;R(sx-h,sy+dy,h*2,2)}}ctx.globalAlpha=1;
    for(let dy=-14;dy<=14;dy++){if(lo&&dy>2&&dy%4==0)continue;
      ctx.fillStyle=lo?(dy<-5?'#fff2a8':dy<3?'#ffd45e':'#ff9a5a'):(dy<-6?'#ffffff':'#fffbe0');
      const h=Math.sqrt(196-dy*dy);R(sx-h,sy+dy,h*2,1)}}
  // clouds
  ctx.fillStyle=env.cl;
  for(let i=0;i<6;i++){const d=wrapA(i*1.05+t*.01-hd);
    if(Math.abs(d)<1.3){const x=W/2+F*Math.tan(d),y=14+(i*17)%34,w=22+(i%3)*8;R(x-w/2,y,w,3);R(x-w/2+5,y-2,w-12,2)}}
  // mountains
  const mt=(x,h,h2,sl,lit,shd,sn,sns)=>{h=Math.round(h/2)*2;const l=h2<h;
    ctx.fillStyle=l?lit:shd;R(x,HZ-h,1,h);
    if(h>sl){ctx.fillStyle=l?sn:sns;R(x,HZ-h,1,h-sl)}};
  for(let x=0;x<W;x++){const a=hd+ca[x];
    mt(x,far(a),far(a+.03),28,env.mf[0],env.mf[1],env.mf[2],env.mf[3]);mtH[x]=far(a)}
  for(let x=0;x<W;x++){const a=hd+ca[x];
    mt(x,near(a),near(a+.03),19,env.mn[0],env.mn[1],env.mn[2],env.mn[3]);mtH[x]=Math.max(mtH[x],near(a))}
  // ocean
  const gAz=env.sEl>-.03?env.sAz:env.mEl>0?env.mAz:null,dS=gAz==null?9:wrapA(gAz-hd),sunX=Math.abs(dS)<1.3?W/2+F*Math.tan(dS):-999;
  for(let y=HZ;y<H;y++){
    const z=CH*F/(y-HZ+.5),f=Math.min(1,Math.max(0,(z-12)/35)),k=1-f,row=y*W,gw=1+(y-HZ)*.25,hz=Math.min(.6,Math.max(0,(z-50)/120)),by=(y&3)*4;
    for(let x=0;x<W;x++){
      const r=XS[x]*z,wx=cx+s*z+c*r,wz=cz+c*z-s*r;
      if(wz<tE+2.5){buf[row+x]=shoreC(wx,wz);continue}
      const w0=Math.sin(wx*.9+Math.sin(wz*.5+t*.8)*1.2)+Math.sin(wz*1.1-t*1.1+Math.sin(wx*.4)*1.3),w=k*w0;
      if(Math.abs(x-sunX)<gw&&w0>1.25+Math.abs(x-sunX)/gw*.6){buf[row+x]=GLT[w0>1.5?0:1];continue}
      if(hz&&B[(x&3)+by]/16<hz){buf[row+x]=HAZE;continue}
      buf[row+x]=w>1.5?O[3]:w>.5?O[2]:w>-.6?O[1]:O[0];
    }}
  ctx.putImageData(img,0,0,0,HZ,W,H-HZ);
  // buoys
  const L=[];
  for(const b of bu){const dx=rel(b.x-px)+s*5,dz=rel(b.z-pz)+c*5,z=dx*s+dz*c;
    if(z>1.2&&z<95&&pz+rel(b.z-pz)>4)L.push([z,dx*c-dz*s,b.x])}
  {const lm=zones*100,add=(X,Z)=>{const dx=X-px+s*5,dz=Z-pz+c*5,z=dx*s+dz*c;if(z>1.2&&z<95)L.push([z,dx*c-dz*s,X+Z,1])};
    for(let X=1-XB;X<=XB;X+=7)if(Math.abs(X-px)<100)add(X,lm);
    for(let Z=Math.max(0,Math.floor((pz-60)/7)*7);Z<=Math.min(lm,pz+60);Z+=7){add(-XB,Z);add(XB,Z)}}
  L.sort((a,b)=>b[0]-a[0]);
  for(const[z,xx,id,bd]of L){
    const sx=W/2+xx/z*F,h=Math.round(F*(bd?1.8:1.1)/z),w=Math.max(2,h*.4);
    if(sx<-40||sx>W+40)continue;
    const sy=HZ+CH*F/z+Math.sin(t*2+id)*h*.04,f=Math.min(1,Math.max(0,(z-8)/80));
    ctx.globalAlpha=1-f*.85;
    ctx.fillStyle=bd?'#ff8a1e':'#e23b3b';R(sx-w/2,sy-h*.7,w,h*.7);
    ctx.fillStyle='#fff';R(sx-w/2,sy-h*.5,w,h*.15);
    ctx.fillStyle='#2b2a4a';R(sx-w*.7,sy-h*.12,w*1.4,h*.12);
    ctx.fillStyle=(t*3+id)%2<1?'#fff27a':'#8a6a1a';R(sx-w/4,sy-h,w/2,h*.3);
  }
  drawSchools(cx,cz,s,c);drawLandObjs(cx,cz,s,c);drawOthers(cx,cz,s,c);
  // wake
  ctx.fillStyle='#e8fbff';
  for(const p of wake){const dx=p.x-cx,dz=p.z-cz,z=dx*s+dz*c;
    if(z<1)continue;const w=Math.max(1,F*.1/z);
    ctx.globalAlpha=p.l;R(W/2+(dx*c-dz*s)/z*F,HZ+CH*F/z,w,w/2)}
  ctx.globalAlpha=1;
  // boat
  const bob=Math.round(Math.sin(t*5)*.7+(bump>0?Math.sin(t*60)*2:0)),bx=W/2,by=(mode>3||fpc&&mode==3?400:144)+bob;
  const q=(x,y,w,h,col)=>{ctx.fillStyle=col;R(bx+x+roll*-y/8,by+y,w,h)};
  if(vT>=0&&!(dead&&dead.t>.25))myVes(q,bx,by);
  drawBooms(cx,cz,s,c);nightSky();
  // hud
  const deg=((hd*180/Math.PI)%360+360)%360|0;
  hud.textContent='SPD '+Math.round(Math.abs(sp)*2)+' KN\nHDG '+['N','NE','E','SE','S','SW','W','NW'][Math.round(deg/45)%8]+' '+deg+'°';
}

// tuna + bait schools (last 20s, then vanish)
const hs=(k,i)=>{const v=Math.sin(k*12.9898+i*78.233)*43758.5453;return v-Math.floor(v)};
const TN=[[4,0,5,1,'#14307a'],[2,1,9,1,'#14307a'],[1,2,11,1,'#2a58b8'],[2,3,9,1,'#cfe6f2'],[4,4,5,1,'#eef8fc'],[0,0,1,2,'#14307a'],[0,3,1,2,'#14307a'],[9,1,1,1,'#fff']];
function drawTuna(sx,sy,len,fc,pt){
  const cl=len/12;
  for(const[c0,r,w,h,col]of TN){ctx.fillStyle=col;const x0=fc>0?c0:12-c0-w;
    R(sx+(x0-6)*cl,sy+(r-2.5)*cl-pt*(c0+w/2-6)*cl*.35,w*cl,h*cl)}
}
function mkSchool(){
  const r=Math.random,a=hd+(r()-.5)*1.2,d=22+r()*24,tuna=[],bait=[];
  for(let i=0;i<4;i++)tuna.push({ph:r()*3,per:2+r()*1.6});
  for(let i=0;i<30;i++)bait.push({a:r()*TAU,r:.4+r()*1.9,w:(r()<.5?-1:1)*(.8+r()*1.2)});
  sch.push({x:Math.max(6-XB,Math.min(XB-6,px+Math.sin(a)*d)),z:Math.max(10,Math.min(zones*100-6,pz+Math.cos(a)*d)),vx:(r()-.5)*.6,vz:(r()-.5)*.6,age:0,life:20,seed:r()*100,tuna,bait});
}
function splash(x,z,tt,pr,al){
  const p=pr(x,z);if(!p)return;
  const l=tt/.5,rr=l*1.1,sc=F/p[2];
  ctx.globalAlpha=al*(1-l*.6);ctx.fillStyle='#fff';
  R(p[0]-rr*sc,p[1],2*rr*sc,1);
  for(let j=0;j<7;j++){const a=j*TAU/7,e=Math.sin(l*Math.PI)*.9*(.6+.4*Math.sin(j*2));
    R(p[0]+Math.cos(a)*rr*sc,p[1]-e*sc+Math.sin(a)*rr*sc*CH/p[2],Math.max(1,.08*sc),Math.max(1,.08*sc))}
}
function drawSchools(cx,cz,s,c){
  const pr=(x,z)=>{const dx=x-cx,dz=z-cz,zz=dx*s+dz*c;return zz<1.5?null:[W/2+(dx*c-dz*s)/zz*F,HZ+CH*F/zz,zz]};
  for(const h of sch){
    const dd=Math.hypot(h.x-cx,h.z-cz);if(dd>95)continue;
    const vis=Math.min(1,h.age/1.5,(h.life-h.age)/2),al=vis*(1-Math.min(1,Math.max(0,(dd-8)/80))*.85),pc=pr(h.x,h.z);
    ctx.globalAlpha=al;
    
    const k=Math.floor(t*7);ctx.fillStyle='#e8fbff';
    for(let i=0;i<9;i++){const a=hs(k,i+h.seed)*TAU,rr=Math.sqrt(hs(k,i+40+h.seed))*2.4,p=pr(h.x+Math.cos(a)*rr,h.z+Math.sin(a)*rr);
      if(p)R(p[0],p[1],Math.min(8,F*.09/p[2]),1)}
    for(const b of h.bait){const a=b.a+t*b.w,rr=b.r*(1+.25*Math.sin(t*3+b.a*4)),p=pr(h.x+Math.cos(a)*rr,h.z+Math.sin(a)*rr);
      if(!p)continue;
      const hop=Math.pow(Math.max(0,Math.sin(t*2.5+b.a*9)),12)*.5,n=Math.min(6,F*.1/p[2]);
      ctx.fillStyle=(t*6+b.a*5)%3<.4?'#fff':'#a9d6ee';R(p[0],p[1]-hop*F/p[2],n,n)}
    h.tuna.forEach((tn,i)=>{
      const T=h.age+tn.ph,k=Math.floor(T/tn.per),tl=T-k*tn.per,dur=.9,an=hs(k,i+h.seed)*TAU,ux=Math.cos(an),uz=Math.sin(an);
      const x0=h.x+ux*2.8,z0=h.z+uz*2.8,x1=h.x-ux*1.8,z1=h.z-uz*1.8;
      if(tl<dur){const u=tl/dur,p=pr(x0+(x1-x0)*u,z0+(z1-z0)*u);
        if(p){ctx.globalAlpha=al;const len=F*1.3/p[2];
